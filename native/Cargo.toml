[workspace]
resolver = "2"
members = ["app", "crates/mv-core", "crates/mv-net", "crates/mv-sources", "crates/mv-plugins", "crates/mv-media", "crates/mv-ai", "crates/mv-torrent", "crates/mv-ui", "crates/mv-webwall", "crates/mv-studio", "crates/ui-manga", "crates/ui-media", "crates/ui-player", "crates/ui-assistant", "crates/ui-settings", "crates/ui-studio", "crates/mv-recap", "crates/mv-update", "setup"]

[workspace.package]
edition = "2021"
version = "8.0.4"
license = "Proprietary"

[workspace.dependencies]
gpui-kit = "0.7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
libloading = "0.8"
raw-window-handle = "0.6"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
