[package]
name = "mv-torrent"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
mv-core = { path = "../mv-core" }
axum = "0.8"
bytes = "1"
futures = "0.3"
# Vendored + patched for streaming latency, see vendor/librqbit/Cargo.toml.
librqbit = { path = "vendor/librqbit", version = "9.0.1", default-features = false, features = ["default-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
