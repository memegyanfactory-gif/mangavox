<!DOCTYPE html>
<html><head><title>MangaFire</title></head><body>
<!-- Hand-written from the strip reader of the current React build: every page gets a .reader__page slot, but its <img class="reader-img"> is only mounted while the slot is near the viewport. -->
<div id="app-root"><div class="reader reader--strip">
  <div class="reader__page" data-index="0" style="aspect-ratio: 690 / 1280"><img class="reader-img" src="https://static.mfcdn.example/ch/9001/001.jpg" alt="page 1" decoding="async"></div>
  <div class="reader__page" data-index="1" style="aspect-ratio: 690 / 1280"><img class="reader-img" src="https://static.mfcdn.example/ch/9001/002.jpg" alt="page 2" decoding="async"></div>
  <div class="reader__page" data-index="2" style="aspect-ratio: 690 / 1280"><img class="reader-img" src="https://static.mfcdn.example/ch/9001/003.jpg" alt="page 3" decoding="async"></div>
  <div class="reader__page" data-index="3" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="4" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="5" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="6" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="7" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="8" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="9" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="10" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="11" style="aspect-ratio: 690 / 1280"></div>
  <div class="reader__page" data-index="12" style="aspect-ratio: 690 / 1280"></div>
</div></div>
</body></html>
