[package]
name = "mv-create"
edition.workspace = true
version.workspace = true

[dependencies]
mv-core = { path = "../mv-core" }
mv-ai = { path = "../mv-ai" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Balloon lettering (both already in the lockfile through mv-recap).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
tokio = { version = "1", features = ["rt", "time", "process", "fs"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
