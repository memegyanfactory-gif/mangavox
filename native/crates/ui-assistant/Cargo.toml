[package]
name = "ui-assistant"
edition.workspace = true
version.workspace = true

[dependencies]
gpui-kit = { workspace = true }
mv-ui = { path = "../mv-ui" }
mv-ai = { path = "../mv-ai" }
mv-core = { path = "../mv-core" }
mv-media = { path = "../mv-media" }
mv-youtube = { path = "../mv-youtube" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
sysinfo = "0.31"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
# The MCP server token (already in the lockfile).
getrandom = "0.3"
# Local dates for the chat-history groups (Today, Yesterday...); already in the lockfile via mv-core and ui-manga.
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
