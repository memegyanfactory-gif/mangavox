name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Compute next version
        id: ver
        shell: pwsh
        run: |
          $toml = Get-Content native/Cargo.toml
          $cargo = $null
          $inWs = $false
          foreach ($line in $toml) {
            if ($line -match '^\s*\[(.+)\]\s*$') { $inWs = ($Matches[1] -eq 'workspace.package'); continue }
            if ($inWs -and $line -match '^\s*version\s*=\s*"(\d+\.\d+\.\d+)"') { $cargo = [version]$Matches[1]; break }
          }
          if (-not $cargo) { throw 'workspace.package version not found' }
          $latest = $null
          foreach ($t in (git tag --sort=-v:refname)) {
            if ($t -match '^v(\d+\.\d+\.\d+)$') { $latest = [version]$Matches[1]; break }
          }
          if ($latest -and $latest -ge $cargo) {
            $next = "{0}.{1}.{2}" -f $latest.Major, $latest.Minor, ($latest.Build + 1)
          } else {
            $next = $cargo.ToString()
          }
          Write-Host "cargo=$cargo latest=$latest next=$next"
          "version=$next" >> $env:GITHUB_OUTPUT

      - name: Write version into Cargo.toml
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $lines = Get-Content native/Cargo.toml
          $inWs = $false
          $done = $false
          $out = foreach ($line in $lines) {
            if ($line -match '^\s*\[(.+)\]\s*$') { $inWs = ($Matches[1] -eq 'workspace.package') }
            if ($inWs -and -not $done -and $line -match '^\s*version\s*=') {
              $done = $true
              'version = "' + $v + '"'
            } else { $line }
          }
          if (-not $done) { throw 'version line not replaced' }
          [IO.File]::WriteAllText("$PWD/native/Cargo.toml", (($out -join "`n") + "`n"))
          Push-Location native
          cargo update -w
          Pop-Location

      - name: Package
        shell: pwsh
        run: pwsh scripts/package.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Commit, tag, push
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/Cargo.toml native/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "chore(release): v$v [skip release]" }
          git tag "v$v"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$v"

      - name: Create GitHub release
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          gh release create "v$v" --title "MangaVox v$v" --generate-notes `
            "dist/MangaVox-$v-win64.zip" "dist/MangaVox-Setup-$v.exe" "dist/SHA256SUMS.txt"
